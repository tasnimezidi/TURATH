<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turath | تراث</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            height: 100vh;
background-image: url('images/accueil.jpg');            background-size: cover;
            background-position: center;
        }

        .overlay {
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            color: white;
            margin-bottom: 10px;
        }

        .arabic {
            font-size: 2rem;
            color: #C9A84C;
            margin-bottom: 20px;
        }

        p {
            color: #f0f0f0;
            font-size: 1.1rem;
            max-width: 400px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn {
            background-color: #C0392B;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #a93226;
        }

        .langue {
            margin-top: 30px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .langue span {
            margin: 0 10px;
            cursor: pointer;
            color: #C9A84C;
        }
       .navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
background: rgba(255, 255, 255, 0.2);    display: flex;
    justify-content: space-around;
    padding: 12px 0;
    z-index: 999;
    backdrop-filter: blur(8px);
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.7rem;
    gap: 2px;
}

.nav-item span {
    font-size: 1.3rem;
}

.nav-item.active {
    color: #C9A84C;
}
    </style>
</head>
<script>
   function choisirLangue(langue) {
    localStorage.setItem('langue', langue);
    document.querySelectorAll('.langue span').forEach(s => s.style.fontWeight = 'normal');
    event.target.style.fontWeight = 'bold';
}

// Au chargement → toujours remettre français par défaut
localStorage.setItem('langue', 'fr');
// Traduire la navbar
const navTexts = {
    fr: { accueil: 'Accueil', carte: 'Carte', favoris: 'Favoris', about: 'À propos' },
    en: { accueil: 'Home', carte: 'Map', favoris: 'Favourites', about: 'About' },
    ar: { accueil: 'الرئيسية', carte: 'الخريطة', favoris: 'المفضلة', about: 'حول' }
}[langue] || { accueil: 'Accueil', carte: 'Carte', favoris: 'Favoris', about: 'À propos' };

document.querySelector('#nav-accueil small').textContent = navTexts.accueil;
document.querySelector('#nav-carte small').textContent = navTexts.carte;
document.querySelector('#nav-favoris small').textContent = navTexts.favoris;
document.querySelector('#nav-about small').textContent = navTexts.about;
</script>




<nav class="navbar">
    <a href="index.html" class="nav-item" id="nav-accueil">
        <span>🏠</span>
        <small>Accueil</small>
    </a>
    <a href="map.html" class="nav-item" id="nav-carte">
        <span>🗺️</span>
        <small>Carte</small>
    </a>
    <a href="favoris.html" class="nav-item" id="nav-favoris">
        <span>❤️</span>
        <small>Favoris</small>
    </a>
    <a href="about.html" class="nav-item" id="nav-about">
        <span>ℹ️</span>
        <small>À propos</small>
    </a>
</nav>
<body>

    <div class="overlay">
        <h1>Turath</h1>
        <div class="arabic">تراث</div>
        <p>Découvrez les sites historiques de la Tunisie sur une carte interactive</p>
        <a href="map.html" class="btn">Découvrir la carte →</a>
       <div class="langue">
                <span onclick="choisirLangue('fr')">Français</span> | 
                <span onclick="choisirLangue('en')">English</span> | 
                <span onclick="choisirLangue('ar')">العربية</span>
        </div>
    </div>

</body>
</html>
