<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turath | Carte</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Georgia, serif; }

        header {
            background-color: #C0392B;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        header h1 { font-size: 1.2rem; }

        .filtres {
            background: white;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 2px solid #eee;
        }

        .filtre-btn {
            padding: 6px 15px;
            border: 2px solid #C0392B;
            border-radius: 20px;
            background: white;
            color: #C0392B;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .filtre-btn.active {
            background: #C0392B;
            color: white;
        }

        .legende {
            background: white;
            padding: 8px 15px;
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
        }

        .legende-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cercle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        #map {
            height: calc(100vh - 130px);
            width: 100%;
        }

        .recherche {
    position: relative;
    padding: 10px 15px;
    background: white;
    border-bottom: 1px solid #eee;
}

#input-recherche {
    width: 100%;
    padding: 10px 15px;
    border: 2px solid #eee;
    border-radius: 25px;
    font-size: 1rem;
    outline: none;
}

#input-recherche:focus {
    border-color: #C0392B;
}

#suggestions {
    position: absolute;
    top: 55px;
    left: 15px;
    right: 15px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    z-index: 1000;
}

.suggestion-item {
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.95rem;
}

.suggestion-item:hover {
    background: #f9f9f9;
    color: #C0392B;
}
    </style>
</head>
<body>

    <header>
        
    <a href="index.html" id="btn-accueil">← Accueil</a>
    <h1>Turath | تراث</h1>
    <a href="favoris.html" id="btn-favoris">❤️</a>
    
</header> 

 <div class="filtres">
    <button class="filtre-btn active" id="btn-tous" onclick="filtrer('tous', this)">Tous</button>
    <button class="filtre-btn" id="btn-carthaginois" onclick="filtrer('carthaginois', this)">Carthaginois</button>
    <button class="filtre-btn" id="btn-romain" onclick="filtrer('romain', this)">Romains</button>
    <button class="filtre-btn" id="btn-islamique" onclick="filtrer('islamique', this)">Islamique</button>
    <button class="filtre-btn" id="btn-ottoman" onclick="filtrer('ottoman', this)">Ottoman</button>
</div>

<div class="legende">
    <div class="legende-item"><span class="cercle" style="background:purple"></span> <span id="leg-carthaginois">Carthaginois</span></div>
    <div class="legende-item"><span class="cercle" style="background:orange"></span> <span id="leg-romain">Romains</span></div>
    <div class="legende-item"><span class="cercle" style="background:green"></span> <span id="leg-islamique">Islamique</span></div>
    <div class="legende-item"><span class="cercle" style="background:blue"></span> <span id="leg-ottoman">Ottoman</span></div>
</div>

<div class="recherche">
    <input 
        type="text" 
        id="input-recherche" 
        placeholder="🔍 Rechercher un monument..."
        oninput="rechercherMonument()"
    />
    <div id="suggestions"></div>
</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([34.0, 9.0], 6);
        // Lire la langue
const langue = localStorage.getItem('langue') || 'fr';

// Traductions des filtres
const traductions = {
    fr: {
        tous: 'Tous',
        carthaginois: 'Carthaginois',
        romain: 'Romains',
        islamique: 'Islamique',
        ottoman: 'Ottoman',
        voirFiche: 'Voir la fiche →'
    },
    en: {
        tous: 'All',
        carthaginois: 'Carthaginian',
        romain: 'Roman',
        islamique: 'Islamic',
        ottoman: 'Ottoman',
        voirFiche: 'See details →'
    },
    ar: {
        tous: 'الكل',
        carthaginois: 'قرطاجي',
        romain: 'روماني',
        islamique: 'إسلامي',
        ottoman: 'عثماني',
        voirFiche: 'عرض التفاصيل ←'
    }
};

const t = traductions[langue] || traductions['fr'];
 
// Traduire header et légende
document.getElementById('btn-accueil').textContent = langue === 'ar' ? '→ الرئيسية' : langue === 'en' ? '← Home' : '← Accueil';
document.getElementById('btn-tous').textContent = t.tous;
document.getElementById('btn-carthaginois').textContent = t.carthaginois;
document.getElementById('btn-romain').textContent = t.romain;
document.getElementById('btn-islamique').textContent = t.islamique;
document.getElementById('btn-ottoman').textContent = t.ottoman;
document.getElementById('leg-carthaginois').textContent = t.carthaginois;
document.getElementById('leg-romain').textContent = t.romain;
document.getElementById('leg-islamique').textContent = t.islamique;
document.getElementById('leg-ottoman').textContent = t.ottoman;

// Si arabe → direction droite à gauche
if (langue === 'ar') {
    document.body.style.direction = 'rtl';
}

// Traduire les boutons filtres
document.querySelector('[onclick="filtrer(\'tous\', this)"]').textContent = t.tous;
document.querySelector('[onclick="filtrer(\'carthaginois\', this)"]').textContent = t.carthaginois;
document.querySelector('[onclick="filtrer(\'romain\', this)"]').textContent = t.romain;
document.querySelector('[onclick="filtrer(\'islamique\', this)"]').textContent = t.islamique;
document.querySelector('[onclick="filtrer(\'ottoman\', this)"]').textContent = t.ottoman;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

      const sites = [
    {
        nom: "Amphithéâtre de Carthage",
        nomAr: "مدرج قرطاج",
        nomEn: "Carthage Amphitheatre",
        ville: "Tunis", villeAr: "تونس", villeEn: "Tunis",
        epoque: "carthaginois",
        epoqueLabel: "Carthaginois", epoqueLabelAr: "قرطاجي", epoqueLabelEn: "Carthaginian",
        lat: 36.8528, lng: 10.3233
    },
    {
        nom: "Amphithéâtre d'El Jem",
        nomAr: "مدرج الجم",
        nomEn: "El Jem Amphitheatre",
        ville: "Mahdia", villeAr: "المهدية", villeEn: "Mahdia",
        epoque: "romain",
        epoqueLabel: "Romain", epoqueLabelAr: "روماني", epoqueLabelEn: "Roman",
        lat: 35.2969, lng: 10.7073
    },
    {
        nom: "Grande Mosquée de Kairouan",
        nomAr: "جامع القيروان الكبير",
        nomEn: "Great Mosque of Kairouan",
        ville: "Kairouan", villeAr: "القيروان", villeEn: "Kairouan",
        epoque: "islamique",
        epoqueLabel: "Islamique", epoqueLabelAr: "إسلامي", epoqueLabelEn: "Islamic",
        lat: 35.6781, lng: 10.0963
    },
    {
        nom: "Ribat de Monastir",
        nomAr: "رباط المنستير",
        nomEn: "Ribat of Monastir",
        ville: "Monastir", villeAr: "المنستير", villeEn: "Monastir",
        epoque: "islamique",
        epoqueLabel: "Islamique", epoqueLabelAr: "إسلامي", epoqueLabelEn: "Islamic",
        lat: 35.7697, lng: 10.8262
    },
    {
        nom: "Théâtre romain de Dougga",
        nomAr: "المسرح الروماني بدقة",
        nomEn: "Roman Theatre of Dougga",
        ville: "Béja", villeAr: "باجة", villeEn: "Béja",
        epoque: "romain",
        epoqueLabel: "Romain", epoqueLabelAr: "روماني", epoqueLabelEn: "Roman",
        lat: 36.4228, lng: 9.2194
    }
];

        const couleurs = {
            carthaginois: "purple",
            romain: "orange",
            islamique: "green",
            ottoman: "blue"
        };

        let marqueurs = [];

        sites.forEach(site => {
            const marqueur = L.circleMarker([site.lat, site.lng], {
                radius: 10,
                fillColor: couleurs[site.epoque],
                color: "white",
                weight: 2,
                fillOpacity: 0.9
            }).addTo(map);

const nomAffiche = langue === 'ar' ? site.nomAr : langue === 'en' ? site.nomEn : site.nom;
const villeAffiche = langue === 'ar' ? site.villeAr : langue === 'en' ? site.villeEn : site.ville;
const epoqueAffiche = langue === 'ar' ? site.epoqueLabelAr : langue === 'en' ? site.epoqueLabelEn : site.epoqueLabel;

marqueur.bindPopup(`
    <b>${nomAffiche}</b><br>
    📍 ${villeAffiche}<br>
    🏛️ ${epoqueAffiche}<br>
    <a href="site.html?nom=${encodeURIComponent(site.nom)}" 
    style="color:#C0392B; font-weight:bold;">
    ${t.voirFiche}</a>
`);
            marqueur.epoque = site.epoque;
            marqueurs.push(marqueur);
        });

        function filtrer(epoque, btn) {
            document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            marqueurs.forEach(m => {
                if (epoque === 'tous' || m.epoque === epoque) {
                    m.addTo(map);
                } else {
                    map.removeLayer(m);
                }
            });
        }

        function rechercherMonument() {
    const input = document.getElementById('input-recherche').value.toLowerCase();
    const suggestions = document.getElementById('suggestions');
    suggestions.innerHTML = '';

    if (input.length < 2) return;

    const resultats = sites.filter(site => {
        const nom = langue === 'ar' ? site.nomAr : langue === 'en' ? site.nomEn : site.nom;
        return nom.toLowerCase().includes(input);
    });

    resultats.forEach(site => {
        const nom = langue === 'ar' ? site.nomAr : langue === 'en' ? site.nomEn : site.nom;
        const ville = langue === 'ar' ? site.villeAr : langue === 'en' ? site.villeEn : site.ville;

        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.textContent = nom + ' — ' + ville;

        div.onclick = () => {
            // Zoomer sur le monument
            map.setView([site.lat, site.lng], 13);

            // Ouvrir le popup du marqueur
            marqueurs.forEach(m => {
                if (m.epoque === site.epoque && 
                    m.getLatLng().lat === site.lat) {
                    m.openPopup();
                }
            });

            // Vider la barre
            document.getElementById('input-recherche').value = nom;
            suggestions.innerHTML = '';
        };

        suggestions.appendChild(div);
    });
}

// Fermer suggestions si on clique ailleurs
document.addEventListener('click', (e) => {
    if (!e.target.closest('.recherche')) {
        document.getElementById('suggestions').innerHTML = '';
    }
});
    </script>

</body>
</html>
